<!doctype html>
<html lang="kk">

<title>LinguaVoice AI — интернет жоқ</title>
<meta name="theme-color" content="#0A0B14">
<style>
  :root { color-scheme: dark; }

  .box { max-width: 420px; text-align: center; }

  h1 { font-size: 22px; margin: 0 0 10px; }
  p { color: #A3A9CC; line-height: 1.5; margin: 0 0 20px; }
  button { height: 46px; padding: 0 22px; border-radius: 999px; border: 0; background: linear-gradient(135deg, #4F7BFF, #8B5CFF); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
</style>
</head>

  <div class="box">
    <div class="logo"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M5 10v4M9 6v12M13 8.5v7M17 5v14M21 10v4"/></svg></div>
    <h1>Интернет байланысы жоқ</h1>
